[package]
name = "zellij-mission-control"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "A Zellij plugin that tracks your Claude Code sessions and notifies you when one needs you"
license = "MIT"
repository = "https://github.com/c9rgreen/zellij-mission-control"
readme = "README.md"
keywords = ["zellij", "zellij-plugin", "claude-code", "terminal"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.6", default-features = false, features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
zellij-tile = "0.45.1"
zellij-utils = "0.45.1"
