name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The README pins the release URL and the plugin manifests carry the
      # version, because Zellij caches a plugin by URL. Refuse to release a
      # tag that the files don't agree with; `just bump <version>` sets them.
      - name: Check versions match the tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          fail=0
          check() { grep -qF -- "$2" "$1" || { echo "::error file=$1::expected '$2'"; fail=1; }; }
          check Cargo.toml                 "version = \"$tag\""
          check .claude-plugin/plugin.json "\"version\": \"$tag\""
          check hooks/mission-control-hook.sh "hook_version=\"$tag\""
          check README.md                  "releases/download/v$tag/zellij-mission-control.wasm"
          exit $fail

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - uses: Swatinem/rust-cache@v2

      - name: Build plugin
        run: cargo build --release --target wasm32-wasip1

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            target/wasm32-wasip1/release/zellij-mission-control.wasm
            hooks/mission-control-hook.sh
